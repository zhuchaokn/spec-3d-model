<!doctype html><html lang="zh"><meta charset="utf-8"><title>京津冀飞地并入</title><style>body{background:#102b23;color:#edf2ec;font:18px system-ui;margin:40px}main{max-width:1000px;margin:auto}svg{width:100%;background:#163b30;border-radius:20px}p{line-height:1.7}text{fill:#edf2ec;font:17px system-ui}</style><main><h1>河北飞地，连入京津冀整块</h1><p>北三县连片区域和另一处被京津冀包围的河北飞地均并入河北象牙白区域；原有高程从缓存 DEM 恢复。两个孔不再贯穿合件，底座对应凸台降至槽底。</p><svg viewBox="0 0 1000 470"><g transform="translate(40 60)"><text y="-20">原结构 · 剖面示意</text><path d="M0 130H160V200H240V130H410V220H0Z" fill="#f1e7cf"/><path d="M0 220H160V150H240V220H410V310H0Z" fill="#a6a8ab"/><text y="360">合件有孔，飞地留在底座上</text></g><g transform="translate(550 60)"><text y="-20">新结构 · 剖面示意</text><path d="M0 130H155L180 90L220 120H245V130H410V220H0Z" fill="#f1e7cf"/><path d="M0 220H410V310H0Z" fill="#a6a8ab"/><path d="M0 188H410" stroke="#c5b88f" stroke-width="2" stroke-dasharray="6 6"/><text y="355">连续底层 1.6 mm，飞地仍为河北色</text><text y="390">槽底厚 2 mm，凹槽深 2 mm</text></g></svg><p>两处原孔约 9.95 mm²、1.03 mm²。只更新第 1 盘京津冀合件和第 5 盘底座；江苏上海与其余省份、圆头接口及 0.12 mm 接口公差保留。实际省界轮廓与高度以数据和 model.json 为准。</p></main></html>
