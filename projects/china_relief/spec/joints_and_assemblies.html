<!doctype html><html lang="zh"><meta charset="utf-8"><title>燕尾与省份合件规格</title><style>body{background:#102b23;color:#edf2ec;font:18px system-ui;margin:40px}main{max-width:1000px;margin:auto}svg{width:100%;background:#163b30;border-radius:20px}p{line-height:1.7}text{fill:#edf2ec;font:17px system-ui}</style><main><h1>燕尾连接 · 京津冀 / 江苏上海合件</h1><p>沿用 470 × 470 mm 四片底座。每条拼接边设两个燕尾，接口轮廓每侧 0.12 mm 让位，直线缝隙 0.1 mm。由上向下组装，燕尾头防止水平方向拉开。</p><svg viewBox="0 0 1000 520"><g transform="translate(50 70)"><text y="-20">接口俯视（局部 20 px/mm）</text><path d="M0 0H200V80L260 40V280L200 240V320H0Z" fill="#a6a8ab"/><path d="M202 0H440V320H202V244.218L262.4 284.484V35.516L202 75.782Z" fill="#718678"/><text y="370">颈宽 8 mm · 头宽 12 mm · 伸出 3 mm</text><text y="410">母槽沿配合面法线偏移 0.12 mm</text></g><g transform="translate(570 70)"><text y="-20">合件剖面（示意）</text><rect y="170" width="360" height="64" fill="#f1e7cf"/><path d="M0 170V110L100 40V170Z" fill="#f1e7cf"/><path d="M100 170V40L200 100V170Z" fill="#78b875"/><path d="M200 170V100L280 90L360 140V170Z" fill="#efc84b"/><text y="275">京津冀：河北白 / 北京绿 / 天津黄</text><text y="315">江苏上海：江苏白 / 上海橙</text><text y="365">1.6 mm 连续共用底层</text><text y="405">各省真实地形上表面保留</text></g></svg><p>实际尺寸以 model.json 为准。省份组合后整体可拆，京津沪没有单独打印件。原北京试配盘取消；燕尾试配小样单独提供，不属于儿童拼图。</p></main></html>
