<!doctype html><html lang="zh"><meta charset="utf-8"><title>粗颈圆头接口规格</title><style>body{background:#102b23;color:#edf2ec;font:18px system-ui;margin:40px}main{max-width:1100px;margin:auto}svg{width:100%;background:#163b30;border-radius:20px}p{line-height:1.7}text{fill:#edf2ec;font:17px system-ui}</style><main><h1>粗颈圆头 · 0.12 mm 配合让位</h1><p>圆头像拍面，连接处是粗短颈。圆头直径 12 mm、颈宽 8 mm，伸入相邻底盘 12 mm，根部与圆头交接均作 R0.6 mm 过渡。母槽从同一个公头轮廓向外偏移 0.12 mm，直线缝 0.1 mm。</p><svg viewBox="0 0 1200 640"><g transform="translate(40 65)"><text y="-20">接口俯视 · 20 px/mm · 过渡弧示意</text><path d="M0 0H200V108Q200 120 212 120H227Q237 120 244 107.044A120 120 0 1 1 244 292.956Q237 280 227 280H212Q200 280 200 292V400H0Z" fill="#a6a8ab"/><path d="M202 0H510V400H202V294.4Q202 282.4 214 282.4H227Q239 282.4 245.52 294.815A122.4 122.4 0 1 0 245.52 105.185Q239 117.6 227 117.6H214Q202 117.6 202 105.6Z" fill="#718678"/><text y="445">圆头 Ø12 mm · 连接颈 8 mm</text><text y="480">公母间隙 0.12 mm · 由上方落入拼装</text><text y="515">圆头比颈宽，限制水平方向拉开</text></g><g transform="translate(630 65)"><text y="-20">合件剖面（示意）</text><rect y="170" width="450" height="64" fill="#f1e7cf"/><path d="M0 170V110L140 40V170Z" fill="#f1e7cf"/><path d="M140 170V40L280 100V170Z" fill="#78b875"/><path d="M280 170V100L360 90L450 140V170Z" fill="#efc84b"/><text y="280">京津冀 / 江苏上海保持原样</text><text y="315">共用底层 1.6 mm，地形与省色保留</text><text y="370">四片底座最大约 247 × 247 mm</text><text y="405">P2S 256 mm 打印床，另校验 3 mm brim</text><text y="460">新旧接口不混用，四片底座全部更新</text></g></svg><p>本图为接口规格，实际轮廓和尺寸以 model.json 与数值验证报告为准。整套仍为九盘；先打独立灰色小样确认手感。外框、R5 外角、2 mm 国境槽、南海六层嵌色保留。</p></main></html>
